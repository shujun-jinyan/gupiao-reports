<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>A股智能选股系统 · 实时仪表盘</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:'Microsoft YaHei',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

/* ===== 顶部 ===== */
.topbar { background:#161b22; border-bottom:1px solid #21262d; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:50; }
.logo { font-size:17px; font-weight:bold; color:#f0f6fc; white-space:nowrap; }
.logo .v { font-size:10px; color:#3fb950; background:#1a3a2a; border:1px solid #2ea043; border-radius:3px; padding:1px 5px; margin-left:6px; vertical-align:2px; }
.idx-bar { display:flex; gap:8px; flex:1; overflow-x:auto; scrollbar-width:none; }
.idx-bar::-webkit-scrollbar { display:none; }
.idx-chip { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:4px 12px; font-size:12px; white-space:nowrap; display:flex; gap:8px; align-items:center; }
.idx-chip .n { color:#8b949e; }
.idx-chip .p { font-family:Consolas,monospace; font-weight:bold; }
.up { color:#ff5252; } .down { color:#00cc66; } .flat { color:#8b949e; }
.clock { font-size:12px; color:#8b949e; font-family:Consolas,monospace; white-space:nowrap; }
.net-dot { width:8px; height:8px; border-radius:50%; background:#00cc66; display:inline-block; margin-right:4px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ===== 导航 ===== */
.nav { display:flex; gap:4px; background:#161b22; border-bottom:1px solid #21262d; padding:0 10px; overflow-x:auto; position:sticky; top:49px; z-index:49; }
.nav::-webkit-scrollbar { display:none; }
.nav-item { padding:11px 16px; font-size:13.5px; color:#8b949e; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; user-select:none; position:relative; }
.nav-item:hover { color:#c9d1d9; }
.nav-item.active { color:#f0f6fc; border-bottom-color:#f97316; font-weight:bold; }
.nav-item .dot { position:absolute; top:9px; right:6px; width:6px; height:6px; background:#f97316; border-radius:50%; display:none; }
.nav-item.updated .dot { display:block; }

/* ===== 内容区 ===== */
.content { flex:1; display:flex; flex-direction:column; min-height:0; }
.page { display:none; flex:1; min-height:0; }
.page.active { display:flex; flex-direction:column; }
iframe { width:100%; flex:1; border:none; background:#0d1117; min-height:0; }

/* ===== 实时行情页 ===== */
.live { padding:14px 16px 40px; max-width:1500px; width:100%; margin:0 auto; }
.section-title { font-size:14px; color:#f0f6fc; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:3px; height:14px; background:#f97316; border-radius:2px; }
.section-title .sub { font-size:11px; color:#8b949e; font-weight:normal; }

.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.card { background:#161b22; border:1px solid #21262d; border-radius:10px; padding:14px 16px; }
.card .label { font-size:11px; color:#8b949e; margin-bottom:6px; }
.card .value { font-size:20px; font-weight:bold; font-family:Consolas,monospace; color:#f0f6fc; }
.card .value.sm { font-size:15px; }

table { width:100%; border-collapse:collapse; font-size:12.5px; background:#161b22; border-radius:10px; overflow:hidden; }
.table-wrap { border:1px solid #21262d; border-radius:10px; overflow-x:auto; }
thead th { background:#1c2128; color:#8b949e; font-weight:600; padding:10px 8px; text-align:left; white-space:nowrap; border-bottom:1px solid #30363d; font-size:11.5px; }
tbody td { padding:9px 8px; border-bottom:1px solid #21262d; white-space:nowrap; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:#1a1f2e; }
.mono { font-family:Consolas,monospace; }
.code-c { color:#58a6ff; font-family:Consolas,monospace; }
.name-c { font-weight:500; color:#f0f6fc; }
.tag { font-size:10px; border-radius:3px; padding:1px 6px; border:1px solid; white-space:nowrap; }
.tag-t1 { color:#3fb950; border-color:#2ea043; background:#1a3a2a; }
.tag-t2 { color:#ffaa00; border-color:#b8860b; background:#2a2a1a; }
.tag-t3 { color:#ff6b6b; border-color:#8b0000; background:#3a1a1a; }
.tag-pb { color:#58a6ff; border-color:#1f6feb; background:#1a2233; }
.empty { padding:30px; text-align:center; color:#484f58; font-size:13px; }
.flash-up { animation:fu .8s; } .flash-down { animation:fd .8s; }
@keyframes fu { 0%{background:#3a1a1a} 100%{background:transparent} }
@keyframes fd { 0%{background:#1a3a2a} 100%{background:transparent} }

.refresh-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#8b949e; margin-top:8px; flex-wrap:wrap; gap:6px; }
.tunnel-box { background:#161b22; border:1px dashed #30363d; border-radius:8px; padding:8px 14px; font-size:12px; color:#8b949e; margin-top:14px; }
.tunnel-box a { color:#58a6ff; word-break:break-all; }

/* ===== Toast ===== */
#toast { position:fixed; right:16px; bottom:16px; z-index:100; display:flex; flex-direction:column; gap:8px; }
.toast-item { background:#1a2e1a; border:1px solid #2ea043; color:#3fb950; border-radius:8px; padding:10px 16px; font-size:13px; animation:slidein .3s; box-shadow:0 4px 12px rgba(0,0,0,.5); }
@keyframes slidein { from{transform:translateX(40px);opacity:0} to{transform:none;opacity:1} }

@media (max-width:768px) {
  .topbar { padding:8px 10px; gap:8px; }
  .logo { font-size:14px; }
  .clock { display:none; }
  .nav { top:44px; }
  .nav-item { padding:9px 12px; font-size:12.5px; }
  .live { padding:10px 10px 30px; }
  .card .value { font-size:16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">A股智能选股系统<span class="v">v6.9</span></div>
  <div class="idx-bar" id="idxBar">
    <span class="idx-chip"><span class="n">行情加载中…</span></span>
  </div>
  <div class="clock"><span class="net-dot"></span><span id="clock">--:--:--</span></div>
</div>

<div class="nav" id="nav">
  <div class="nav-item active" data-page="live">实时行情</div>
  <div class="nav-item" data-page="auction">早盘竞价<span class="dot"></span></div>
  <div class="nav-item" data-page="bottom">底部启动<span class="dot"></span></div>
  <div class="nav-item" data-page="review">每日复盘<span class="dot"></span></div>
  <div class="nav-item" data-page="hb_breakout">横盘突破<span class="dot"></span></div>
  <div class="nav-item" data-page="sim">模拟交易<span class="dot"></span></div>
  <div class="nav-item" data-page="diag">AI诊股</div>
</div>

<div class="content">
  <!-- 实时行情 -->
  <div class="page active" id="page-live">
    <div class="live">
      <div class="section-title">指数行情 <span class="sub" id="idxTime"></span></div>
      <div class="cards" id="idxCards"></div>

      <div class="section-title">当日竞价选股监控</div>
      <div class="table-wrap"><table id="pickTable">
        <thead><tr><th>代码</th><th>名称</th><th>竞价涨幅</th><th>评分</th><th>现价</th><th>涨跌幅</th></tr></thead>
        <tbody></tbody>
      </table></div>

      <div class="tunnel-box" id="tunnelBox">云端托管地址：<a href="https://jjungp.top/" target="_blank">https://jjungp.top/</a><br>本页由云端定时任务自动发布，实时行情由浏览器直连腾讯行情接口获取。</div>
    </div>
  </div>

  <!-- 报告页（懒加载 iframe） -->
  <div class="page" id="page-auction"><iframe data-src="./auction.html"></iframe></div>
  <div class="page" id="page-bottom"><iframe data-src="./bottom_start.html"></iframe></div>
  <div class="page" id="page-review"><iframe data-src="./daily_review.html"></iframe></div>
  <div class="page" id="page-hb_breakout"><iframe data-src="./hb_breakout.html"></iframe></div>
  <div class="page" id="page-sim"><iframe data-src="./simulated_trade.html"></iframe></div>
  <div class="page" id="page-diag"><iframe data-src="./ai_diag.html"></iframe></div>
</div>

<div id="toast"></div>

<!-- 云端静态数据（发布时注入：当日竞价选股 + 站点信息） -->
<script id="boot-data" type="application/json">{"site": "https://jjungp.top/", "generated": "2026-10-29 10:03", "picks": [{"code": "603726", "tcode": "sh603726", "name": "朗迪集团", "auction_chg": 8.501643964302508, "score": 1.0, "industry": "橡胶和塑料制品业"}]}</script>

<script>
const $ = s => document.querySelector(s);

const boot = JSON.parse(document.getElementById('boot-data').textContent || '{}');

const state = {
  picks: boot.picks || [],
  lastQuotes: {},       // tcode -> price
  clockOffset: 0,
};

/* ---------- 工具 ---------- */
function fmt(n, d=2) { return n==null||isNaN(n) ? '-' : Number(n).toFixed(d); }
function cls(v) { return v>0 ? 'up' : v<0 ? 'down' : 'flat'; }
function chgHtml(v) { return `<span class="${cls(v)} mono">${v>0?'+':''}${fmt(v)}%</span>`; }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast-item'; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), 6000);
}
function now() { return new Date(Date.now() + state.clockOffset); }
function isTradeTime() {
  const d = now(); const day = d.getDay();
  if (day===0 || day===6) return false;
  const m = d.getHours()*60 + d.getMinutes();
  return (m>=555 && m<=695) || (m>=775 && m<=905);   // 9:15-11:35, 12:55-15:05
}

/* ---------- 导航 ---------- */
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    item.classList.add('active');
    item.classList.remove('updated');
    const page = $('#page-' + item.dataset.page);
    page.classList.add('active');
    const iframe = page.querySelector('iframe');
    if (iframe && !iframe.src) iframe.src = iframe.dataset.src + '?_=' + Date.now();   // 时间戳防浏览器缓存旧报告
  });
});

/* ---------- 行情：腾讯接口 JSONP（script 标签跨域，绕过 CORS/Referer 限制） ---------- */
function parseTx(codes) {
  const out = {};
  codes.forEach(c => {
    const raw = window['v_' + c];
    if (!raw) return;
    const f = raw.split('~');
    if (f.length < 40) return;
    const num = i => { const v = parseFloat(f[i]); return isNaN(v) ? 0 : v; };
    out[c] = { tcode:c, code:f[2], name:f[1], price:num(3), prev_close:num(4), open:num(5),
               change:num(31), change_pct:num(32), high:num(33), low:num(34), quote_time:f[30] };
  });
  return out;
}
function fetchQuotes(codes) {
  return new Promise(resolve => {
    if (!codes.length) { resolve({}); return; }
    const s = document.createElement('script');
    s.charset = 'gbk';
    s.src = 'https://qt.gtimg.cn/q=' + codes.join(',');
    let done = false;
    const finish = () => { if (done) return; done = true; resolve(parseTx(codes)); s.remove(); };
    s.onload = finish;
    s.onerror = () => { if (!done) { done = true; resolve({}); s.remove(); } };
    document.head.appendChild(s);
    setTimeout(finish, 6000);   // 兜底超时
  });
}

/* ---------- 行情轮询（交易时段5s / 闲时60s） ---------- */
async function pollQuotes() {
  const codes = ['sh000001','sz399001','sz399006', ...state.picks.map(p=>p.tcode)];
  const q = await fetchQuotes(codes);
  renderIdx(q);
  renderPicks(q);
  state.lastQuotes = Object.fromEntries(Object.entries(q).map(([k,v])=>[k,v.price]));
}

/* ---------- 渲染 ---------- */
function renderIdx(q) {
  const bar = $('#idxBar'); const cards = $('#idxCards');
  const list = ['sh000001','sz399001','sz399006'];
  const names = {sh000001:'上证指数', sz399001:'深证成指', sz399006:'创业板指'};
  bar.innerHTML = list.filter(c=>q[c]).map(c=>{
    const it = q[c];
    return `<span class="idx-chip"><span class="n">${names[c]}</span>
      <span class="p ${cls(it.change_pct)}">${fmt(it.price)}</span>
      <span class="mono ${cls(it.change_pct)}">${it.change_pct>0?'+':''}${fmt(it.change_pct)}%</span></span>`;
  }).join('') || '<span class="idx-chip"><span class="n">行情获取失败，稍后重试</span></span>';
  cards.innerHTML = list.filter(c=>q[c]).map(c=>{
    const it = q[c];
    return `<div class="card"><div class="label">${names[c]}</div>
      <div class="value ${cls(it.change_pct)}">${fmt(it.price)}</div>
      <div class="mono ${cls(it.change_pct)}" style="font-size:12px;margin-top:4px">
        ${it.change>0?'+':''}${fmt(it.change)} (${it.change_pct>0?'+':''}${fmt(it.change_pct)}%)</div></div>`;
  }).join('');
  const t = q['sh000001']?.quote_time || '';
  if (t.length>=14) $('#idxTime').textContent = `数据时间 ${t.slice(4,6)}:${t.slice(6,8)}:${t.slice(8,10)}`;
}

function renderPicks(q) {
  const tb = $('#pickTable tbody');
  if (!state.picks.length) { tb.innerHTML = '<tr><td colspan="6"><div class="empty">今日竞价选股结果尚未生成（等待 9:25 定时任务）</div></td></tr>'; return; }
  tb.innerHTML = state.picks.map(p=>{
    const it = q ? q[p.tcode] : null;
    const flash = it && state.lastQuotes[p.tcode]!=null && it.price!==state.lastQuotes[p.tcode]
      ? (it.price>state.lastQuotes[p.tcode] ? 'flash-up' : 'flash-down') : '';
    return `<tr class="${flash}">
      <td class="code-c">${p.code}</td><td class="name-c">${p.name}</td>
      <td class="mono" style="color:#ffaa00">${p.auction_chg>0?'+':''}${fmt(p.auction_chg)}%</td>
      <td class="mono" style="color:#3fb950;font-weight:bold">${fmt(p.score)}</td>
      <td class="mono" style="color:#f0f6fc;font-weight:bold">${it?fmt(it.price):'-'}</td>
      <td>${it?chgHtml(it.change_pct):'-'}</td></tr>`;
  }).join('');
}

/* ---------- 时钟 & 循环 ---------- */
setInterval(()=>{ const c = $('#clock'); if (c) c.textContent = now().toLocaleTimeString('zh-CN',{hour12:false}); }, 1000);

renderPicks(null);   // 先用静态数据渲染一次，行情到位后再刷新
(async function quoteLoop() {
  await pollQuotes();
  setInterval(pollQuotes, isTradeTime() ? 5000 : 60000);
})();
</script>
</body>
</html>
